<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoTagMate</title>
    <link rel="icon" href="icons/icon32.png">
    <link href="css/ui.css" rel="stylesheet">
    <style>
        .page { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; display: grid; gap: 28px; }
        .hero { display: flex; gap: 16px; align-items: center; }
        .hero img { width: 56px; height: 56px; }
        .hero h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
        .hero p { color: var(--muted); margin-top: 2px; }
        .section-title { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 4px 8px; }
        .block { padding: 16px; display: grid; gap: 10px; }
        .block + .block, .row + .block, .block + .row { border-top: 1px solid var(--border); }
        .key-line { display: flex; gap: 8px; }
        .key-line .input { font-family: var(--mono); cursor: pointer; caret-color: transparent; }
        .how { margin: 0; padding: 16px 16px 16px 34px; display: grid; gap: 8px; }
        .how li::marker { color: var(--accent); }
        .try { min-height: 110px; font-family: var(--font); font-size: 14px; }
    </style>
</head>

<body>
    <main class="page">
        <header class="hero">
            <img src="icons/icon128.png" alt="">
            <div>
                <h1 data-i18n="optTitle"></h1>
                <p data-i18n="optSubtitle"></p>
            </div>
        </header>

        <section>
            <h2 class="section-title" data-i18n="optGeneral"></h2>
            <div class="card">
                <label class="row">
                    <span class="row-text">
                        <span class="row-title" data-i18n="optEnabled"></span>
                        <span class="row-hint" data-i18n="optEnabledHint" style="display:block"></span>
                    </span>
                    <input type="checkbox" class="switch" id="enabled">
                </label>

                <div class="block">
                    <label class="row-title" for="activationKey" data-i18n="optKey"></label>
                    <div class="key-line">
                        <input type="text" id="activationKey" class="input" readonly data-i18n-placeholder="optKeyPlaceholder">
                        <button type="button" class="btn" id="resetKey" data-i18n="optKeyReset"></button>
                    </div>
                    <p class="row-hint" data-i18n="optKeyHint"></p>
                    <p class="error" id="keyError" role="alert"></p>
                </div>

                <label class="row">
                    <span class="row-text">
                        <span class="row-title" data-i18n="optAutoClose"></span>
                        <span class="row-hint" data-i18n="optAutoCloseHint" style="display:block"></span>
                    </span>
                    <input type="checkbox" class="switch" id="autoCloseTag">
                </label>

                <div class="block">
                    <label class="row-title" for="excludedSites" data-i18n="optExcluded"></label>
                    <textarea id="excludedSites" class="textarea" data-autotagmate="off" rows="4" spellcheck="false" placeholder="example.com&#10;mail.example.org"></textarea>
                    <p class="row-hint" data-i18n="optExcludedHint"></p>
                </div>
            </div>
        </section>

        <section>
            <h2 class="section-title" data-i18n="optTry"></h2>
            <textarea class="textarea try" id="tryIt" data-i18n-placeholder="optTryPlaceholder"></textarea>
        </section>

        <section>
            <h2 class="section-title" data-i18n="optHow"></h2>
            <ol class="card how">
                <li data-i18n="optHow1"></li>
                <li data-i18n="optHow2"></li>
                <li data-i18n="optHow3"></li>
            </ol>
        </section>
    </main>

    <div class="toast" id="toast" role="status" data-i18n="optSaved"></div>

    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <!-- Content scripts are not injected into extension pages, so the
         "Try it" field loads the same script directly. -->
    <script src="content_script.js"></script>
    <script src="options.js"></script>
</body>

</html>
